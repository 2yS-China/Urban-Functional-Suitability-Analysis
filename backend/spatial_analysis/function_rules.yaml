综合:
  description: "综合用地适宜性评价（混合功能）"
  weight: 1.0
  criteria:
    - feature: dist_to_metro
      weight: 0.20
      direction: minimize
      ideal_range: [0, 500]
      acceptable_range: [0, 1000]
      
    - feature: road_accessibility
      weight: 0.15
      direction: maximize
      ideal_range: [0.7, 1.0]
      acceptable_range: [0.5, 1.0]
      
    - feature: mixed_use_potential
      description: "混合使用潜力"
      weight: 0.25
      direction: maximize
      ideal_range: [0.6, 1.0]
      acceptable_range: [0.4, 1.0]
      
    - feature: density_balance
      description: "密度均衡性"
      weight: 0.20
