    - feature: connectivity
      description: "连通性"
      weight: 0.20
      direction: maximize
      ideal_range: [0.6, 1.0]
      acceptable_range: [0.4, 1.0]

# 评分函数配置
scoring:
  # 归一化方法
  normalization: "min-max"  # min-max, z-score, sigmoid
  
  # 范围映射函数
  range_mapping:
    type: "linear"  # linear, exponential, sigmoid
    
  # 理想范围内得分
  ideal_score: 1.0
  
  # 可接受范围内得分衰减
  acceptable_decay: "linear"  # linear, exponential
  
  # 超出可接受范围得分
  out_of_range_score: 0.0

# 推荐策略配置
recommendation:
  # 推荐模式
  mode: "max_score"  # max_score: 选择最高分, balanced: 平衡考虑, constraint_first: 约束优先
  
  # 最小可接受分数
  min_acceptable_score: 0.4
  
  # 是否考虑空间协调
  spatial_coordination: true
  
  # 邻接相容性权重
  adjacency_weight: 0.15